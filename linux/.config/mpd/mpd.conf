# Music directory - adjust to your music location
music_directory    "~/Music/"

# User-local paths
db_file            "~/.local/share/mpd/database"
state_file         "~/.local/share/mpd/state"
sticker_file       "~/.local/share/mpd/sticker.sql"
playlist_directory "~/.local/share/mpd/playlists"

# No need for log_file or pid_file in systemd mode

# Audio output - PipeWire/PulseAudio
audio_output {
    type    "pipewire"
    name    "PipeWire Sound Server"
}

audio_output {
    type        "fifo"
    name        "cava"
    path        "/tmp/mpd.fifo"
    format      "44100:16:2"
}
# Optional fallback for PulseAudio
#audio_output {
#    type    "pulse"
#    name    "PulseAudio"
#}

# Bind to user socket only (no TCP needed for local use)
bind_to_address "~/.local/share/mpd/socket"
