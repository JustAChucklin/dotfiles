include theme.conf

# Font
font_family      3270 Nerd Font 
font_size 14.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Use fish shell
shell bash

# Copy
# map ctrl+c    copy_or_interrupt

# Search
# map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
# map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
# map page_up    scroll_page_up
# map page_down    scroll_page_down

# map ctrl+plus  change_font_size all +1
# map ctrl+equal  change_font_size all +1
# map ctrl+kp_add  change_font_size all +1
# map ctrl+minus       change_font_size all -1
# map ctrl+underscore       change_font_size all -1
# map ctrl+kp_subtract       change_font_size all -1
# map ctrl+0 change_font_size all 0
# map ctrl+kp_0 change_font_size all 0


map ctrl+shift+u no_op
## --- Kitty with tmux-like bindings (fixed) ----------------

# Tabs (tmux “windows”)
map ctrl+b>c        new_tab
map ctrl+b>,        set_tab_title
map ctrl+b>n        next_tab
map ctrl+b>p        previous_tab
# tmux uses "&" to kill window; US layout "&" = shift+7. Also give a simple alias.
map ctrl+b>shift+7  close_tab
map ctrl+b>q        close_tab

# Select tab 1..10 (tmux 0..9). Here 0 -> tab 10.
map ctrl+b>1        goto_tab 1
map ctrl+b>2        goto_tab 2
map ctrl+b>3        goto_tab 3
map ctrl+b>4        goto_tab 4
map ctrl+b>5        goto_tab 5
map ctrl+b>6        goto_tab 6
map ctrl+b>7        goto_tab 7
map ctrl+b>8        goto_tab 8
map ctrl+b>9        goto_tab 9
map ctrl+b>0        goto_tab 10

# Splits (tmux “panes”)
# tmux: " (hsplit) and % (vsplit). Safer letter aliases: s/v.
# map ctrl+b>s        launch --location=split
# map ctrl+b>v        launch --location=vsplit
# Optional exact-symbols (US keyboards):
map ctrl+b>shift+apostrophe launch --location=split   
map ctrl+b>shift+5         launch --location=vsplit   
# Docs for launch/splits and layouts. :contentReference[oaicite:1]{index=1}

# Kill pane (tmux: x)
map ctrl+b>x        close_window

# Move between panes (tmux: arrows and hjkl)
map ctrl+b>left     neighboring_window left
map ctrl+b>right    neighboring_window right
map ctrl+b>up       neighboring_window up
map ctrl+b>down     neighboring_window down
map ctrl+b>h        neighboring_window left
map ctrl+b>j        neighboring_window down
map ctrl+b>k        neighboring_window up
map ctrl+b>l        neighboring_window right
# tmux: o (cycle next pane)
map ctrl+b>o        next_window
# These action names are correct in Kitty. :contentReference[oaicite:2]{index=2}

# Resize panes (tmux: H/J/K/L)
map ctrl+b>H        resize_window narrower 5
map ctrl+b>L        resize_window wider 5
map ctrl+b>K        resize_window taller 2
map ctrl+b>J        resize_window shorter 2
map ctrl+b>=        reset_window_sizes
# Resizing semantics. :contentReference[oaicite:3]{index=3}

# Layouts (tmux: space to cycle, z to zoom)
map ctrl+b>space    next_layout
map ctrl+b>z        toggle_layout stack
# “next_layout” cycles enabled layouts; “toggle_layout stack” acts like zoom. :contentReference[oaicite:4]{index=4}

# Copy/Scrollback (tmux: [ / ])
map ctrl+b>[        show_scrollback
map ctrl+b>]        paste_from_clipboard

# Optional: keep the selection of layouts small
enabled_layouts     splits,tall,grid

# Nice to have
shell_integration enabled



